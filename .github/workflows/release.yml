name: Release

# Builds store artifacts on version tags (v*), creates a GitHub release, and
# publishes to the extension stores when credentials are configured.
#
# Store publishing requires these repository secrets:
#   Chrome Web Store (https://github.com/fregante/chrome-webstore-upload/blob/main/How%20to%20generate%20Google%20API%20keys.md):
#     CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
#   Mozilla Add-ons (https://addons.mozilla.org/en-US/developers/addon/api/key/):
#     AMO_JWT_ISSUER, AMO_JWT_SECRET
#   Microsoft Edge Add-ons (Partner Center > Edge > Publish API):
#     EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_API_KEY
# Missing credentials skip the corresponding publish step with a warning, so
# the GitHub release still gets created and the zips can be uploaded manually.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js 23.x
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          cache: npm

      - name: Verify manifest version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('src/manifest.json'))['version'])")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match src/manifest.json version ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Build Chrome
        run: make build-chrome
      - name: Build Firefox
        run: make build-firefox
      - name: Build source archive (for AMO reviewers)
        run: make zip-src

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              artifacts/chrome.zip artifacts/firefox.zip artifacts/src.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              artifacts/chrome.zip artifacts/firefox.zip artifacts/src.zip \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Check store credentials
        id: creds
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          cws=false
          if [ -n "$CWS_CLIENT_ID" ] && [ -n "$CWS_CLIENT_SECRET" ] && [ -n "$CWS_REFRESH_TOKEN" ]; then
            cws=true
          elif [ -n "$CWS_CLIENT_ID$CWS_CLIENT_SECRET$CWS_REFRESH_TOKEN" ]; then
            echo "::error::Partial Chrome Web Store credentials: all of CWS_CLIENT_ID, CWS_CLIENT_SECRET and CWS_REFRESH_TOKEN must be set"
            exit 1
          fi
          amo=false
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            amo=true
          elif [ -n "$AMO_JWT_ISSUER$AMO_JWT_SECRET" ]; then
            echo "::error::Partial Mozilla Add-ons credentials: both AMO_JWT_ISSUER and AMO_JWT_SECRET must be set"
            exit 1
          fi
          edge=false
          if [ -n "$EDGE_PRODUCT_ID" ] && [ -n "$EDGE_CLIENT_ID" ] && [ -n "$EDGE_API_KEY" ]; then
            edge=true
          elif [ -n "$EDGE_PRODUCT_ID$EDGE_CLIENT_ID$EDGE_API_KEY" ]; then
            echo "::error::Partial Edge Add-ons credentials: all of EDGE_PRODUCT_ID, EDGE_CLIENT_ID and EDGE_API_KEY must be set"
            exit 1
          fi
          echo "cws=$cws" >> "$GITHUB_OUTPUT"
          echo "edge=$edge" >> "$GITHUB_OUTPUT"
          echo "amo=$amo" >> "$GITHUB_OUTPUT"

      - name: Publish to Chrome Web Store
        if: steps.creds.outputs.cws == 'true'
        env:
          EXTENSION_ID: nglaklhklhcoonedhgnpgddginnjdadi
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        # bare command = upload + publish
        run: npx --yes chrome-webstore-upload-cli@4.0.1 --source artifacts/chrome.zip

      - name: Publish to Mozilla Add-ons
        if: steps.creds.outputs.amo == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          # zip-src wiped build/; recreate the unzipped Firefox build for web-ext
          make update-firefox
          npx --yes web-ext@10.6.0 sign \
            --channel listed \
            --source-dir build \
            --upload-source-code artifacts/src.zip \
            --approval-timeout 0

      - name: Publish to Microsoft Edge Add-ons
        if: steps.creds.outputs.edge == 'true'
        env:
          PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          API_KEY: ${{ secrets.EDGE_API_KEY }}
          # Override EDGE_POLL_RETRIES to tune the 10s-per-attempt polling budget.
          # Default 60 retries = 10 minutes; validation typically finishes in 1-3 min.
          # Expected operation response: {"id":"...","status":"InProgress"|"Succeeded"|"Failed","message":"..."}
          EDGE_POLL_RETRIES: ${{ vars.EDGE_POLL_RETRIES || '60' }}
        # Edge Add-ons API v1.1: upload the Chrome zip as the draft package,
        # wait for validation, then publish the draft.
        run: |
          base="https://api.addons.microsoftedge.microsoft.com/v1/products/$PRODUCT_ID/submissions"
          auth=(-H "Authorization: ApiKey $API_KEY" -H "X-ClientID: $CLIENT_ID")
          poll() {  # $1 = operation URL path; polls until status != InProgress; prints final JSON
            retries="${EDGE_POLL_RETRIES:-60}"
            for _ in $(seq 1 "$retries"); do
              resp=$(curl -fsS "${auth[@]}" "$1")
              status=$(echo "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))")
              if [ "$status" != "InProgress" ]; then echo "$resp"; [ "$status" = "Succeeded" ]; return; fi
              sleep 10
            done
            echo "::error::Timed out waiting for Edge operation after $retries attempts"; return 1
          }
          op=$(curl -fsS -D - -o /dev/null -X POST "${auth[@]}" -H "Content-Type: application/zip" \
                 --data-binary @artifacts/chrome.zip "$base/draft/package" \
               | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          [ -n "$op" ] || { echo "::error::Edge upload returned no operation id"; exit 1; }
          poll "$base/draft/package/operations/$op"
          op=$(curl -fsS -D - -o /dev/null -X POST "${auth[@]}" -H "Content-Type: application/json" \
                 -d '{"notes":"Automated release ${{ github.ref_name }}"}' "$base" \
               | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          [ -n "$op" ] || { echo "::error::Edge publish returned no operation id"; exit 1; }
          poll "$base/operations/$op"

      - name: Warn about skipped publishes
        if: steps.creds.outputs.cws != 'true' || steps.creds.outputs.amo != 'true' || steps.creds.outputs.edge != 'true'
        run: |
          [ "${{ steps.creds.outputs.cws }}" = "true" ] || echo "::warning::CWS credentials missing - chrome.zip was not uploaded to the Chrome Web Store"
          [ "${{ steps.creds.outputs.amo }}" = "true" ] || echo "::warning::AMO credentials missing - firefox.zip was not submitted to Mozilla Add-ons"
          [ "${{ steps.creds.outputs.edge }}" = "true" ] || echo "::warning::Edge credentials missing - chrome.zip was not uploaded to the Microsoft Edge Add-ons store"
