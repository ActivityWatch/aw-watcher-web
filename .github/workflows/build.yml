name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js 23.x
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          cache: npm

      - name: Build Firefox
        run: make build-firefox
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox
          path: artifacts/firefox.zip
      - name: Check reproducibility from src-zip
        run: make test-reproducibility-firefox

      - name: Build Chrome
        run: make build-chrome
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome
          path: artifacts/chrome.zip
      - name: Check reproducibility from src-zip
        run: make test-reproducibility-chrome
  build-safari:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Safari
        run: make build-safari

      - name: Check reproducibility from src-zip
        run: make test-reproducibility-safari

      - name: Convert Chrome Extension to Safari
        run: |
          xcrun safari-web-extension-converter ./build \
            --project-location . \
            --bundle-identifier net.activitywatch.activitywatchwebwatcher \
            --macos-only \
            --force

      # Xcode 26's safari-web-extension-converter applies --bundle-identifier
      # only to the extension target and derives the app target's identifier
      # from the app name (net.activitywatch.ActivityWatch-Web-Watcher), which
      # fails ValidateEmbeddedBinary ("Embedded binary's bundle identifier is
      # not prefixed with the parent app's bundle identifier"). Force both
      # targets to the intended identifiers.
      - name: Normalize bundle identifiers
        run: |
          BUNDLE_ID="net.activitywatch.activitywatchwebwatcher"
          PBXPROJ="ActivityWatch Web Watcher/ActivityWatch Web Watcher.xcodeproj/project.pbxproj"
          sed -i '' -E \
            -e "s/(PRODUCT_BUNDLE_IDENTIFIER = )\"?[^;\"]+\.Extension\"?;/\1${BUNDLE_ID}.Extension;/" \
            -e "/\.Extension;/!s/(PRODUCT_BUNDLE_IDENTIFIER = )\"?[^;\"]+\"?;/\1${BUNDLE_ID};/" \
            "$PBXPROJ"
          grep -n 'PRODUCT_BUNDLE_IDENTIFIER' "$PBXPROJ"
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};" "$PBXPROJ"
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}.Extension;" "$PBXPROJ"
          ! grep 'PRODUCT_BUNDLE_IDENTIFIER' "$PBXPROJ" | grep -vE "= ${BUNDLE_ID}(\.Extension)?;$"

      - name: Build Xcode Project
        run: |
          xcodebuild -project "ActivityWatch Web Watcher/ActivityWatch Web Watcher.xcodeproj" -list
          xcodebuild -project "ActivityWatch Web Watcher/ActivityWatch Web Watcher.xcodeproj" \
                     -scheme "ActivityWatch Web Watcher" \
                     -configuration Release \
                     clean build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: safari
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release/
            artifacts/safari.zip
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js 23.x
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          cache: npm

      - name: Install dependencies
        run: make install

      - name: Typecheck TypeScript
        run: make compile
